<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecanico</title>
    <link rel="stylesheet" href="index.html">
</head>

<body>

    <header
        style="background: #1a1a1a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #d32f2f;">
        <div style="font-weight: bold; font-family: 'Arial Black'; font-size: 1.2rem;">AUTO<span
                style="color: #d32f2f;">FIX</span></div>
        <div style="font-size: 0.9rem;">
            <span style="margin-right: 15px;">📞 +503 7000-0000</span>
            <span>📍 Sonsonate, El Salvador</span>
        </div>
    </header>

    <section id="servicios" style="
    padding: 80px 20px; 
    background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('assets/Taller-autos.jpg'); 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed;
    color: white;">

        <h2
            style="text-align: center; color: #ffffff; font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
            NUESTROS SERVICIOS
        </h2>

        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px;">

            <div
                style="background: white; width: 280px; padding: 25px; border-radius: 12px; border-bottom: 5px solid #d32f2f; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.3s;">
                <div style="font-size: 40px; margin-bottom: 10px;">🔧</div>
                <h3 style="color: #d32f2f; margin-top: 0;">Mecánica General</h3>
                <p style="color: #444; font-size: 0.95rem; line-height: 1.4;">Reparaciones precisas para cualquier tipo
                    de falla en tu motor.</p>
            </div>

            <div
                style="background: white; width: 280px; padding: 25px; border-radius: 12px; border-bottom: 5px solid #d32f2f; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.3s;">
                <div style="font-size: 40px; margin-bottom: 10px;">🛢️</div>
                <h3 style="color: #d32f2f; margin-top: 0;">Cambio de Aceite</h3>
                <p style="color: #444; font-size: 0.95rem; line-height: 1.4;">Utilizamos lubricantes de alta gama para
                    proteger la vida de tu motor.</p>
            </div>

        </div>
    </section>

    <style>
        div[style*="transition: transform 0.3s"]:hover {
            transform: translateY(-10px);
            cursor: pointer;
        }
    </style>

</body>

</html>
